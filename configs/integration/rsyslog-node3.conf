# /etc/rsyslog.d/30-firewalla.conf auf Node 3 - Lizenz: MIT
# Ablage fuer MSP-Poller (Tag firewalla-msp) und lokales Suricata (local5)

if ($programname == "firewalla-msp") then {
    action(type="omfile" file="/var/log/remote/firewalla-msp.log")
    stop
}
if ($syslogfacility-text == "local5") then {
    action(type="omfile" file="/var/log/remote/suricata-alerts.log")
    # Optional Weiterleitung an Node 2 (Analytics) per TCP:
    # action(type="omfwd" target="10.10.80.12" port="6514" protocol="tcp")
    stop
}
